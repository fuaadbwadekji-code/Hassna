<title>Hasnaa &amp; Fouad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --p0: #1f0d36;
  --p1: #2d1450;
  --p2: #4a2275;
  --p3: #6a3a96;
  --pink: #ff7eb6;
  --rose: #f06292;
  --card: rgba(247, 230, 245, .95);
  --card2: rgba(232, 208, 238, .9);
  --ink: #3b1a50;
  --ink2: #7a5a8f;
  --btn: #7b2a96;
  --btn2: #a23fb5;
  --line: rgba(123, 42, 150, .14);
  --fade: #321654;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --app-h: 100dvh;
  --fz: 1;
  --ff: "Cairo", "Noto Sans Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--p0); color: #fff; }
body {
  font-family: var(--ff);
  font-size: calc(16px * var(--fz, 1)); line-height: 1.5; overflow: hidden; overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
[hidden] { display: none !important; }
.ic { flex-shrink: 0; display: block; }

/* ---------- Cadre ---------- */
#root {
  position: fixed; inset: 0; height: var(--app-h); margin: 0 auto; width: min(100%, 440px);
  background:
    radial-gradient(circle at 15% 8%, rgba(255, 126, 182, .18), transparent 40%),
    radial-gradient(circle at 90% 55%, rgba(162, 63, 181, .25), transparent 45%),
    linear-gradient(180deg, var(--p1), var(--p2) 70%, #3b1c63);
  overflow: hidden;
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.center { align-items: center; justify-content: center; padding: 24px; overflow-y: auto; }

/* ---------- Illustration d'en-tête ---------- */
.art {
  position: absolute; top: 0; inset-inline: 0; height: 290px; overflow: hidden; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 45%, transparent 100%);
}
.art svg { width: 100%; height: 100%; display: block; }
.art.bottom {
  top: auto; bottom: 0; height: 240px;
  -webkit-mask-image: linear-gradient(to top, #000 45%, transparent 100%);
  mask-image: linear-gradient(to top, #000 45%, transparent 100%);
}
.in { position: relative; flex: 1; overflow-y: auto; padding: calc(118px + var(--safe-top)) 16px 110px; -webkit-overflow-scrolling: touch; }
.in.tight { padding-bottom: 24px; }
.ttl {
  display: flex; align-items: center; gap: 10px; margin: 0 4px 14px;
  font-size: calc(25px * var(--fz, 1)); font-weight: 700; text-shadow: 0 2px 14px rgba(20, 5, 40, .55);
}
.ttl .ic { color: #fff; filter: drop-shadow(0 0 6px rgba(255, 126, 182, .7)); }
.back {
  position: absolute; z-index: 5; top: calc(14px + var(--safe-top)); inset-inline-start: 14px;
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(30, 10, 55, .45); backdrop-filter: blur(6px); color: #fff;
}
[dir="rtl"] .back .ic { transform: scaleX(-1); }

/* ---------- Cartes ---------- */
.glass {
  background: var(--card); color: var(--ink); border-radius: 26px; padding: 6px 14px;
  box-shadow: 0 10px 34px rgba(15, 4, 35, .4), inset 0 0 0 1px rgba(255, 255, 255, .45);
}
.glass.pad { padding: 16px; }
.card2 {
  background: var(--card); color: var(--ink); border-radius: 20px; padding: 14px 16px; margin-bottom: 12px;
  box-shadow: 0 8px 24px rgba(15, 4, 35, .32), inset 0 0 0 1px rgba(255, 255, 255, .45);
}
.sec { font-size: calc(13px * var(--fz, 1)); color: rgba(255, 255, 255, .75); margin: 18px 6px 8px; font-weight: 600; }
.muted { color: var(--ink2); }
.small { font-size: calc(13px * var(--fz, 1)); }

/* ---------- Boutons / champs ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px;
  border-radius: 24px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--btn2), var(--btn)); box-shadow: 0 6px 18px rgba(123, 42, 150, .55);
}
.btn.ghost { background: rgba(255, 255, 255, .12); box-shadow: none; }
.btn.light { background: rgba(255, 255, 255, .75); color: var(--btn); box-shadow: none; }
.btn.danger { background: rgba(214, 69, 69, .12); color: #c23a3a; box-shadow: none; }
.btn.pillbtn { background: linear-gradient(135deg, #f4c6ee, #d9a8ee); color: #5a1f78; box-shadow: 0 0 0 2px rgba(255, 255, 255, .35), 0 8px 24px rgba(255, 126, 182, .35); }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .55; }
.link { color: #ffc2e0; font-weight: 600; padding: 10px; width: 100%; text-align: center; }
input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="time"], textarea {
  width: 100%; background: rgba(255, 255, 255, .92); color: var(--ink); border: 1.5px solid transparent;
  border-radius: 16px; padding: 11px 14px; margin: 5px 0; outline: none; font-size: calc(16px * var(--fz, 1));
}
textarea { resize: none; }
input::placeholder, textarea::placeholder { color: #a58bb5; }
input:focus, textarea:focus { border-color: var(--pink); }
.ink-input input, .ink-input textarea { background: rgba(123, 42, 150, .08); }
.lbl { font-size: calc(13px * var(--fz, 1)); font-weight: 600; color: var(--ink2); margin: 10px 4px 2px; }
.code-input { text-align: center; letter-spacing: .35em; font-weight: 700; text-transform: uppercase; direction: ltr; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; min-width: 0; }

.seg { display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: rgba(255, 255, 255, .22); margin-bottom: 14px; }
.seg button { flex: 1; padding: 8px 6px; border-radius: 999px; font-weight: 700; font-size: calc(15px * var(--fz, 1)); color: rgba(255, 255, 255, .85); }
.seg button.on { background: #fff; color: var(--btn); box-shadow: 0 2px 10px rgba(0, 0, 0, .2); }

/* ---------- Tâches ---------- */
.trow { padding: 12px 0; border-bottom: 1px solid var(--line); }
.trow:last-child { border-bottom: 0; }
.tmain { display: flex; align-items: center; gap: 12px; }
.cb {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid #9a6bb3; display: grid; place-items: center;
  color: #fff; flex-shrink: 0; background: transparent;
}
.cb.on { background: var(--btn); border-color: var(--btn); }
.tbody { flex: 1; min-width: 0; text-align: start; }
.tt { font-weight: 700; font-size: calc(17px * var(--fz, 1)); color: var(--ink); overflow-wrap: anywhere; }
.trow.done .tt { text-decoration: line-through; color: var(--ink2); }
.tm { font-size: calc(13px * var(--fz, 1)); color: var(--ink2); }
.tm.late { color: #c23a3a; }
.fav { color: #b27fc7; padding: 6px; }
.fav.on { color: var(--rose); }
.note {
  display: flex; align-items: center; gap: 8px; margin: 8px 0 0; padding: 7px 12px; border-radius: 14px;
  background: rgba(160, 100, 190, .16); color: #5b2a78; font-size: calc(14px * var(--fz, 1));
}
.note span { flex: 1; overflow-wrap: anywhere; }
.note .ic:first-child { color: var(--rose); }
.empty { text-align: center; padding: 30px 10px; color: var(--ink2); }
.empty .ic { margin: 0 auto 8px; color: #b27fc7; }

.fab {
  position: absolute; z-index: 6; inset-inline-end: 18px; bottom: calc(86px + var(--safe-bottom));
  width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #8a2fa8, #5e1f80);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, .28), 0 10px 24px rgba(20, 5, 40, .6);
}

/* ---------- Barre d'onglets ---------- */
.tabs {
  position: absolute; z-index: 7; inset: auto 0 0 0; display: flex; justify-content: space-around;
  padding: 8px 14px calc(8px + var(--safe-bottom)); background: rgba(246, 226, 244, .97);
  border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(15, 4, 35, .35);
}
.tab { width: 52px; height: 46px; display: grid; place-items: center; color: #8a5aa0; border-radius: 50%; position: relative; }
.tab.on { color: var(--btn); background: #fff; box-shadow: 0 0 0 4px rgba(255, 255, 255, .5), 0 4px 14px rgba(123, 42, 150, .35); }
.tab .dot { position: absolute; top: 4px; inset-inline-end: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--rose); border: 2px solid #f6e2f4; }

/* ---------- Accueil ---------- */
.brand { text-align: center; margin: 4px 0 18px; }
.brand .logo { width: 54px; height: 54px; margin: 0 auto 6px; color: var(--pink); filter: drop-shadow(0 0 10px rgba(255, 126, 182, .8)); }
.brand h1 { margin: 0; font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-size: calc(36px * var(--fz, 1)); font-weight: 500; letter-spacing: .01em; text-shadow: 0 0 22px rgba(255, 126, 182, .5); }
.brand p { margin: 4px 0 0; color: rgba(255, 255, 255, .8); font-size: calc(14px * var(--fz, 1)); }
.tile { display: flex; align-items: center; gap: 14px; width: 100%; text-align: start; padding: 14px 16px; margin-bottom: 10px; border-radius: 22px; background: var(--card); color: var(--ink); box-shadow: 0 8px 24px rgba(15, 4, 35, .3), inset 0 0 0 1px rgba(255, 255, 255, .45); }
.tile .ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(135deg, #f7c8ea, #d3a6ee); color: #6a2188; flex-shrink: 0; }
.tile .tx { flex: 1; min-width: 0; }
.tile b { display: block; font-size: calc(17px * var(--fz, 1)); }
.tile span.s { font-size: calc(13px * var(--fz, 1)); color: var(--ink2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { background: var(--rose); color: #fff; border-radius: 999px; min-width: 24px; height: 24px; padding: 0 7px; font-size: calc(13px * var(--fz, 1)); font-weight: 700; display: grid; place-items: center; }
.gear { position: absolute; z-index: 5; top: calc(14px + var(--safe-top)); inset-inline-end: 14px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(30, 10, 55, .45); backdrop-filter: blur(6px); color: #fff; }

/* ---------- Question ---------- */
.qcard { text-align: center; }
.qhead { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; color: var(--btn); }
.qtext { font-size: calc(22px * var(--fz, 1)); font-weight: 700; margin: 10px 0 2px; color: var(--ink); }
.ans-h { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--btn); margin-bottom: 6px; }
.ans-h .ic { color: #a23fb5; }
.ans-t { background: rgba(255, 255, 255, .6); border-radius: 14px; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }

/* ---------- Capsules ---------- */
.crow { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; background: var(--card); color: var(--ink); margin-bottom: 10px; width: 100%; text-align: start; box-shadow: 0 8px 24px rgba(15, 4, 35, .3), inset 0 0 0 1px rgba(255, 255, 255, .45); }
.crow .env { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #f1b5df, #cf9bea); color: #6a2188; display: grid; place-items: center; flex-shrink: 0; }
.crow .tx { flex: 1; min-width: 0; }
.crow b { display: block; font-size: calc(17px * var(--fz, 1)); overflow-wrap: anywhere; }
.crow .s { font-size: calc(13px * var(--fz, 1)); color: var(--ink2); }
.crow .lk { color: #c47a1a; }
.crow.open .lk { color: #2e9e6a; }
.att { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.att img { width: 92px; height: 92px; object-fit: cover; border-radius: 12px; }
.att a { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; background: rgba(160, 100, 190, .16); color: #5b2a78; text-decoration: none; font-size: calc(14px * var(--fz, 1)); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: rgba(160, 100, 190, .16); color: #5b2a78; font-size: calc(13px * var(--fz, 1)); margin: 4px 4px 0 0; }

/* ---------- Notifications ---------- */
.lock { text-align: center; padding-top: 6px; }
.lock .clock { font-size: calc(76px * var(--fz, 1)); font-weight: 500; line-height: 1; letter-spacing: -.02em; direction: ltr; text-shadow: 0 2px 20px rgba(20, 5, 40, .5); }
.lock .date { font-size: calc(18px * var(--fz, 1)); opacity: .92; margin: 4px 0 18px; }
.ncard { display: flex; gap: 10px; padding: 12px 14px; margin-bottom: 10px; border-radius: 20px; background: rgba(238, 218, 244, .93); color: var(--ink); box-shadow: 0 8px 24px rgba(15, 4, 35, .3); text-align: start; }
.ncard .ap { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #ff7eb6, #a23fb5); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.ncard .nb { flex: 1; min-width: 0; }
.ncard .top { display: flex; justify-content: space-between; font-size: calc(12px * var(--fz, 1)); color: var(--ink2); }
.ncard b { display: block; font-size: calc(15px * var(--fz, 1)); }
.ncard .tt2 { font-size: calc(15px * var(--fz, 1)); overflow-wrap: anywhere; }
.ncard .rel { font-size: calc(13px * var(--fz, 1)); color: var(--btn); font-weight: 600; }

/* ---------- Feuilles (modales) ---------- */
.ov { position: absolute; z-index: 20; inset: 0; background: rgba(15, 4, 35, .6); display: flex; align-items: flex-end; animation: fade .2s; }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: #f7e6f5; color: var(--ink); border-radius: 28px 28px 0 0; padding: 18px 18px calc(20px + var(--safe-bottom)); animation: up .25s ease-out; }
.sheet h3 { margin: 0 0 8px; font-size: calc(20px * var(--fz, 1)); text-align: center; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: #cfb2dc; margin: -6px auto 12px; }
.sheet .btn { margin-top: 10px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.themes { display: flex; gap: 10px; margin: 8px 0; }
.themes button { flex: 1; padding: 12px 6px; border-radius: 16px; background: rgba(123, 42, 150, .08); border: 2px solid transparent; color: var(--ink); font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.themes button.on { border-color: var(--btn); background: #fff; color: var(--btn); }
.codebox { font-size: calc(30px * var(--fz, 1)); font-weight: 800; letter-spacing: .3em; text-align: center; direction: ltr; background: rgba(123, 42, 150, .1); border-radius: 16px; padding: 8px; color: var(--btn); }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* ---------- Connexion ---------- */
.authcard { width: 100%; max-width: 380px; text-align: center; }
.authcard .logo { width: 64px; height: 64px; margin: 0 auto 6px; color: var(--pink); filter: drop-shadow(0 0 12px rgba(255, 126, 182, .8)); }
.authcard h1 { margin: 0 0 4px; font-family: "Playfair Display", Georgia, serif; font-weight: 500; font-size: calc(34px * var(--fz, 1)); }
.authcard p { margin: 0 0 14px; color: rgba(255, 255, 255, .8); }
.divider { display: flex; align-items: center; gap: 10px; color: rgba(255, 255, 255, .7); margin: 14px 0 6px; font-size: calc(13px * var(--fz, 1)); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, .25); }
.pairthemes { display: flex; gap: 10px; margin: 8px 0; }
.pairthemes button { flex: 1; padding: 12px 6px; border-radius: 16px; background: rgba(255, 255, 255, .12); border: 2px solid transparent; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pairthemes button.on { border-color: var(--pink); background: rgba(255, 126, 182, .22); }
.logo-pulse { animation: pulse 1.4s ease-in-out infinite; color: var(--pink); }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

.toast {
  position: fixed; left: 50%; bottom: calc(100px + var(--safe-bottom)); transform: translate(-50%, 20px);
  background: #fff; color: var(--ink); padding: 10px 18px; border-radius: 999px; font-size: calc(14px * var(--fz, 1)); font-weight: 600;
  opacity: 0; pointer-events: none; transition: .25s; z-index: 100; max-width: 88vw; text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============================================================
   Entrée : photos au centre, puis code (animations)

  --d: min(33vw, 140px); --u: calc(var(--gh, var(--app-h)) / 100); --g: 28px;

@keyframes landrise { from { transform: translateY(46px); opacity: 0; } }

.gt {
  margin: 0; font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 400;
  font-size: calc(40px * var(--fz, 1)); color: #fbe4f6; text-shadow: 0 0 24px rgba(255, 170, 230, .45); direction: ltr; text-align: center;
}
.gt.t1 {
  position: absolute; inset-inline: 0; top: calc(var(--safe-top) + 8 * var(--u));
  transition: opacity .45s, transform .6s cubic-bezier(.2, .8, .2, 1);
  animation: drop .9s cubic-bezier(.2, .8, .2, 1) backwards;
}
@keyframes drop { from { opacity: 0; transform: translateY(-20px); } }
.gline {
  position: absolute; left: 19%; right: 19%; top: calc(var(--safe-top) + 8 * var(--u) + 66px); height: 2px;
  background: linear-gradient(90deg, transparent, #fbe4f6, transparent); box-shadow: 0 0 12px rgba(255, 200, 240, .6);
  transition: opacity .4s, transform .5s; animation: grow 1s .35s cubic-bezier(.2, .8, .2, 1) backwards;
}
@keyframes grow { from { transform: scaleX(0); opacity: 0; } }

.duo {
  position: absolute; left: 0; right: 0; top: calc(40 * var(--u) - var(--d) / 2);
  display: flex; gap: var(--g); justify-content: center; direction: ltr; transform-origin: 50% 0;
  transition: top .8s cubic-bezier(.2, .9, .2, 1), transform .8s cubic-bezier(.2, .9, .2, 1);
}
.ph {
  width: var(--d); height: var(--d); border-radius: 50%; flex-shrink: 0; padding: 0; background-size: cover; background-position: center;
  border: 2.5px solid #f0c8f4; box-shadow: 0 0 0 4px rgba(240, 200, 244, .16), 0 0 28px rgba(214, 150, 240, .7);
  transition: transform .6s cubic-bezier(.2, .9, .2, 1), opacity .5s, filter .5s, box-shadow .5s;
  animation: pop .9s cubic-bezier(.2, 1.2, .3, 1) backwards, breathe 3.2s 1.1s ease-in-out infinite;
}
.ph.f { animation-delay: .18s, 1.3s; }
.ph:active { transform: scale(.95); }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 4px rgba(240, 200, 244, .16), 0 0 26px rgba(214, 150, 240, .55); }
  50% { box-shadow: 0 0 0 7px rgba(240, 200, 244, .22), 0 0 46px rgba(232, 160, 250, .95); }
}
.ghint {
  position: absolute; inset-inline: 0; text-align: center; margin: 0; font-size: calc(17px * var(--fz, 1)); color: rgba(255, 255, 255, .9);
  top: calc(40 * var(--u) + var(--d) / 2 + 26px); transition: opacity .4s, transform .5s;
  animation: hintin .8s 1.1s backwards, nudge 2.4s 2s ease-in-out infinite;
}
@keyframes hintin { from { opacity: 0; transform: translateY(8px); } }
@keyframes nudge { 0%, 100% { opacity: .95; } 50% { opacity: .5; } }
.glink { margin-top: 12px; padding: 8px 12px; color: rgba(255, 255, 255, .72); font-size: calc(14px * var(--fz, 1)); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.gsetup { position: absolute; left: 0; right: 0; width: max-content; margin: 0 auto; top: calc(40 * var(--u) + var(--d) / 2 + 66px); transition: opacity .4s, transform .5s; animation: hintin .8s 1.3s backwards; }

/* --- phase « code » : les photos montent, le reste arrive en cascade --- */
.gate.phase-code .duo { top: calc(var(--safe-top) + 3 * var(--u)); transform: scale(.84); }
.gate.phase-code .ph { animation: none; }
.gate.who-h .ph.h, .gate.who-f .ph.f { transform: scale(1.1); box-shadow: 0 0 0 5px rgba(240, 200, 244, .3), 0 0 42px rgba(232, 160, 250, .95); }
.gate.who-h .ph.f, .gate.who-f .ph.h { opacity: .42; filter: saturate(.5); transform: scale(.92); }
.gate.phase-code .gt.t1, .gate.phase-code .gline, .gate.phase-code .ghint, .gate.phase-code .gsetup { opacity: 0; pointer-events: none; animation: none; transform: translateY(-16px); }
.gate:not(.phase-code) .gpanel * { pointer-events: none; }
.gpanel {
  position: absolute; inset-inline: 0; display: flex; flex-direction: column; align-items: center; padding: 0 24px;
  top: calc(var(--safe-top) + 3 * var(--u) + var(--d) * .84 + 6px); opacity: 0; pointer-events: none;
}
.gate.phase-code .gpanel { opacity: 1; pointer-events: auto; }
.gpanel .gt { font-size: calc(34px * var(--fz, 1)); margin-top: 8px; color: #f8cfee; }
.gate.phase-code .gpanel > * { animation: rise .6s cubic-bezier(.2, .8, .2, 1) backwards; }
.gate.phase-code .gpanel > :nth-child(2) { animation-delay: .3s; }
.gate.phase-code .gpanel > :nth-child(3) { animation-delay: .38s; }
.gate.phase-code .gpanel > :nth-child(4) { animation-delay: .44s; }
.gate.phase-code .gpanel > :nth-child(5) { animation-delay: .48s; }
.gate.phase-code .gpanel > :nth-child(6) { animation-delay: .54s; }
.gate.phase-code .gpanel > :nth-child(1) { animation-delay: .22s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
.gprompt { margin: 22px 0 0; font-size: calc(20px * var(--fz, 1)); color: #fff; text-align: center; }
.codebox-row { position: relative; display: flex; gap: 12px; justify-content: center; direction: ltr; width: 100%; max-width: 340px; margin: 22px 0 8px; }
.cbx {
  flex: 1 1 0; max-width: 66px; aspect-ratio: 1; min-width: 0; border-radius: 18px; display: grid; place-items: center;
  background: rgba(255, 255, 255, .1); border: 1.5px solid rgba(245, 190, 240, .65);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-size: calc(30px * var(--fz, 1)); line-height: 1; color: #fff; box-shadow: 0 8px 22px rgba(20, 5, 40, .3), inset 0 0 0 1px rgba(255, 255, 255, .06);
  transition: background .15s, transform .2s cubic-bezier(.3, 1.6, .5, 1);
}
.cbx.fill { background: rgba(255, 255, 255, .22); transform: scale(1.06); }
.cbx.cur::after { content: ""; width: 2px; height: 30px; border-radius: 2px; background: #fff; animation: caret 1s steps(2, start) infinite; }
@keyframes caret { to { visibility: hidden; } }
.codein { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: calc(16px * var(--fz, 1)); border: 0; background: none; color: transparent; caret-color: transparent; }
.gate .gpanel .codebox-row.shake { animation: shk .45s; }
@keyframes shk { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.gerr { min-height: 26px; margin-bottom: 10px; color: #ffc2d6; font-weight: 700; font-size: calc(15px * var(--fz, 1)); text-align: center; }
.enter {
  display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; max-width: 340px; height: 58px;
  border-radius: 30px; font-size: calc(20px * var(--fz, 1)); font-weight: 700; color: #2a1245;
  background: linear-gradient(180deg, #f3bde8, #d98fd3); box-shadow: 0 12px 28px rgba(214, 120, 200, .35), inset 0 0 0 1.5px rgba(255, 255, 255, .45);
}
.enter:active { transform: scale(.98); }
.enter.busy { opacity: .6; }
.gate.setup .enter { display: none; }
.gate.phase-code.busy .ph { animation: breathe .9s ease-in-out infinite; }

/* --- sortie vers l'application --- */
.gate.leaving { animation: gout .52s ease-in forwards; }
@keyframes gout { to { opacity: 0; transform: scale(1.07); } }
.gate.leaving .ph { box-shadow: 0 0 0 8px rgba(255, 220, 250, .35), 0 0 80px rgba(255, 200, 250, 1); }

/* ---------- Avatars & accueil par compte ---------- */
.avt { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; background-size: cover; background-position: center; border: 2px solid #f0c8f4; box-shadow: 0 0 14px rgba(214, 150, 240, .6); display: inline-block; }
.avt.lg { width: 82px; height: 82px; border-width: 2.5px; }
.pair { display: inline-flex; direction: ltr; }
.pair .avt + .avt { margin-inline-start: -14px; }
.hello { display: flex; align-items: center; gap: 14px; margin: 0 4px 18px; }
.hello b { display: block; font-size: calc(26px * var(--fz, 1)); line-height: 1.2; text-shadow: 0 2px 14px rgba(20, 5, 40, .55); }
.hello span { color: rgba(255, 255, 255, .8); font-size: calc(15px * var(--fz, 1)); }
.uscard {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: start; padding: 14px 16px; margin-bottom: 12px; border-radius: 24px; color: #fff;
  background: linear-gradient(135deg, #e0559a, #9a3fb5); box-shadow: 0 12px 30px rgba(162, 63, 181, .5), inset 0 0 0 1px rgba(255, 255, 255, .35);
}
.uscard .tx { flex: 1; min-width: 0; }
.uscard b { display: block; font-size: calc(20px * var(--fz, 1)); }
.uscard .s { font-size: calc(13px * var(--fz, 1)); opacity: .9; display: block; line-height: 1.35; }
.pill.light { background: #fff; color: #c2327a; }
.pairhero { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 2px 0 18px; text-align: center; }
.pairhero .sub { color: rgba(255, 255, 255, .78); font-size: calc(14px * var(--fz, 1)); max-width: 280px; }
.fab.low { bottom: calc(24px + var(--safe-bottom)); }

/* ============================================================
   Transitions dans l'application, iPhone
   ============================================================ */
#root.entering > .screen { animation: appin .7s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes appin { from { opacity: 0; transform: scale(.97) translateY(14px); } }
.screen[data-nav="tab"] .in > * { animation: rise .45s cubic-bezier(.2, .8, .2, 1) backwards; }
.screen[data-nav="tab"] .in > :nth-child(2) { animation-delay: .05s; }
.screen[data-nav="tab"] .in > :nth-child(3) { animation-delay: .1s; }
.screen[data-nav="tab"] .in > :nth-child(4) { animation-delay: .15s; }
.screen[data-nav="tab"] .in > :nth-child(5) { animation-delay: .2s; }
.screen[data-nav="tab"] .in > :nth-child(6) { animation-delay: .25s; }
.screen[data-nav="push"] .in { animation: pushin .38s cubic-bezier(.2, .8, .2, 1) backwards; }
.screen[data-nav="pop"] .in { animation: popin .38s cubic-bezier(.2, .8, .2, 1) backwards; }
.screen[data-nav] .art { animation: gin .5s ease-out backwards; }
@keyframes pushin { from { opacity: 0; transform: translateX(-30px); } }
@keyframes popin { from { opacity: 0; transform: translateX(30px); } }
.screen[data-nav] .tab.on .ic { animation: bump .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 0% { transform: scale(.7); } 100% { transform: scale(1); } }
.tile, .uscard, .crow, .btn, .fav, .cb { transition: transform .15s; }
.tile:active, .uscard:active, .crow:active { transform: scale(.985); }
.back, .gear { -webkit-backdrop-filter: blur(6px); }
button, a, input, textarea, label { touch-action: manipulation; }
button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}

.gt.t1 { font-size: calc(36px * var(--fz, 1)); }
.gpanel .gt { font-size: calc(30px * var(--fz, 1)); }

/* cloche + badge */
.bellbtn { position: absolute; z-index: 5; top: calc(14px + var(--safe-top)); right: 14px; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(30, 10, 55, .45); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: #fff; }
.bellbtn:active { transform: scale(.92); }
.bellbtn .badge { position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #ff4f93; color: #fff; font-size: calc(12px * var(--fz, 1)); font-weight: 700;
  display: grid; place-items: center; border: 2px solid #3a2160; animation: badgepop .5s cubic-bezier(.3, 1.7, .5, 1) backwards .4s; }
.bellbtn:has(.badge) svg { transform-origin: 50% 10%; animation: ring 2.8s 1.2s ease-in-out infinite; }
@keyframes badgepop { from { transform: scale(0); } }
@keyframes ring { 0%, 12%, 100% { transform: rotate(0); } 3% { transform: rotate(14deg); } 6% { transform: rotate(-12deg); } 9% { transform: rotate(8deg); } }

/* fenêtre d'notifications */
.ov.pop { align-items: center; justify-content: center; padding: 22px; background: rgba(15, 4, 35, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: fade .25s; }
.popcard { width: 100%; max-width: 380px; max-height: 78%; overflow-y: auto; background: linear-gradient(180deg, #fbeefb, #f1d9f2); color: var(--ink); border-radius: 28px; padding: 18px;
  box-shadow: 0 30px 80px rgba(10, 0, 30, .55), inset 0 0 0 1px rgba(255, 255, 255, .6); transform-origin: 85% 0; animation: popin2 .45s cubic-bezier(.2, 1.15, .3, 1); }
@keyframes popin2 { from { opacity: 0; transform: translateY(-24px) scale(.82); } }
.pop-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.pop-head h3 { margin: 0; font-size: calc(20px * var(--fz, 1)); text-align: start; }
.pop-sub { font-size: calc(13px * var(--fz, 1)); color: var(--ink2); }
.pop-bell { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #ff7eb6, #a23fb5); box-shadow: 0 8px 18px rgba(162, 63, 181, .35); }
.pop-x { margin-inline-start: auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(120, 60, 140, .12); color: var(--ink); }
.pn { display: flex; gap: 10px; padding: 12px; margin-bottom: 8px; border-radius: 18px; background: #fff; box-shadow: 0 4px 14px rgba(120, 50, 140, .1); animation: rise .5s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(.12s + var(--i) * .07s); }
.pn-ic { width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #ff7eb6, #a23fb5); }
.pn-b { flex: 1; min-width: 0; }
.pn-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.pn-h b { font-size: calc(14px * var(--fz, 1)); }
.pn-t { font-size: calc(12.5px * var(--fz, 1)); font-weight: 700; color: var(--btn); white-space: nowrap; }
.pn-t.late { color: #c2327a; }
.pn-s { font-size: calc(15px * var(--fz, 1)); overflow-wrap: anywhere; margin-top: 2px; }
.pop-empty { text-align: center; padding: 22px 10px 14px; display: grid; gap: 6px; color: var(--ink2); }
.pop-empty .zz { color: #b680c8; display: grid; place-items: center; animation: ring 2.8s ease-in-out infinite; }
.pop-empty b { color: var(--ink); font-size: calc(16px * var(--fz, 1)); }
.pop-empty span { font-size: calc(14px * var(--fz, 1)); }

/* photo dans les réglages */
.avset { display: flex; align-items: center; gap: 14px; margin: 4px 0 12px; }
.avpick { position: relative; display: block; cursor: pointer; }
.avt.xl { width: 84px; height: 84px; display: block; }
.avpick .cam { position: absolute; bottom: -2px; right: -2px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #ff7eb6, #a23fb5); border: 2px solid #f7e6f5; }

/* ============ Compagnon ============ */
.petlayer { position: fixed; inset: 0; z-index: 40; pointer-events: none; transition: opacity .3s; }
.petlayer.hide { opacity: 0; }
.pet { position: absolute; left: 0; top: 0; width: 64px; height: 67px; pointer-events: auto; cursor: pointer; transition: transform .8s cubic-bezier(.45, .1, .25, 1); -webkit-tap-highlight-color: transparent; }
.petlayer.hide .pet { pointer-events: none; }
.pet-b { width: 100%; height: 100%; transform-origin: 50% 100%; animation: petidle 3.4s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(20, 5, 40, .35)); position: relative; }
.pet-b svg { display: block; overflow: visible; }
@keyframes petidle { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .97); } }
.p-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: pblink 4.2s infinite; }
@keyframes pblink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.p-zz { opacity: 0; }
.petlayer.sleep .p-eyes { opacity: 0; } .petlayer.sleep .p-zz { opacity: 1; } .petlayer.sleep .pet-b { animation: petsleep 3s ease-in-out infinite; }
@keyframes petsleep { 0%, 100% { transform: scale(1, .96); } 50% { transform: scale(1.04, .92); } }
.zzz { position: absolute; top: -6px; right: -4px; font: 700 15px/1 Cairo, sans-serif; color: #fff; opacity: 0; text-shadow: 0 0 8px #c79af0; }
.zzz i { font-size: calc(11px * var(--fz, 1)); font-style: normal; margin-inline-start: 1px; }
.petlayer.sleep .zzz { animation: zz 2.4s ease-in-out infinite; }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -14px); } }
.p-arm, .p-ear { transform-box: fill-box; }
.p-arm.l { transform-origin: 80% 15%; } .p-arm.r { transform-origin: 20% 15%; }
.p-ear.l { transform-origin: 60% 90%; } .p-ear.r { transform-origin: 40% 90%; }

.pet-b.jump { animation: pjump .8s cubic-bezier(.3, .7, .4, 1); }
@keyframes pjump { 0% { transform: scale(1.12, .84); } 22% { transform: translateY(-46px) rotate(calc(var(--dir, 1) * 8deg)) scale(.94, 1.1); } 62% { transform: translateY(-14px) rotate(calc(var(--dir, 1) * -4deg)); } 82% { transform: scale(1.14, .82); } 100% { transform: none; } }
.pet-b.hop { animation: phop .7s cubic-bezier(.3, .7, .4, 1); }
@keyframes phop { 0%, 100% { transform: scale(1.1, .88); } 40% { transform: translateY(-30px) scale(.95, 1.08); } 80% { transform: scale(1.08, .9); } }
.pet-b.drop { animation: pdrop 1.1s cubic-bezier(.3, 1.2, .5, 1); }
@keyframes pdrop { 0% { transform: translateY(-420px) scale(.9, 1.1); opacity: 0; } 55% { transform: translateY(0) scale(1.18, .82); opacity: 1; } 75% { transform: translateY(-22px) scale(.96, 1.05); } 100% { transform: none; } }
.pet-b.spin { animation: pspin .9s cubic-bezier(.4, .1, .3, 1); }
@keyframes pspin { 0% { transform: scale(1.1, .9); } 30% { transform: translateY(-34px) rotate(0); } 70% { transform: translateY(-34px) rotate(360deg); } 100% { transform: rotate(360deg); } }
.pet-b.dance { animation: pdance .8s ease-in-out 2; }
@keyframes pdance { 0%, 100% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-12deg) translateY(-14px); } 75% { transform: rotate(12deg) translateY(-14px); } }
.pet-b.dance .p-arm.l { animation: parmup .4s ease-in-out infinite alternate; } .pet-b.dance .p-arm.r { animation: parmup .4s ease-in-out infinite alternate-reverse; }
@keyframes parmup { from { transform: rotate(0); } to { transform: rotate(-55deg); } }
.pet-b.wave .p-arm.r { animation: pwave .35s ease-in-out 4 alternate; }
@keyframes pwave { from { transform: rotate(0); } to { transform: rotate(60deg); } }
.pet-b.peek { animation: ppeek 1.5s ease-in-out; }
@keyframes ppeek { 0%, 100% { transform: none; } 25%, 75% { transform: translateY(30px) scaleY(.7); } }
.pet-b.peek .p-ear { animation: pear .3s ease-in-out 4 alternate; }
@keyframes pear { to { transform: rotate(12deg); } }

.pet-say { position: absolute; bottom: calc(100% + 6px); left: 50%; white-space: nowrap; padding: 7px 13px; border-radius: 16px; background: #fff; color: var(--ink); font-size: calc(14px * var(--fz, 1)); font-weight: 700;
  box-shadow: 0 8px 20px rgba(20, 5, 40, .35); opacity: 0; transform: translate(calc(-50% + var(--sx, 0px)), 8px) scale(.7); transform-origin: 50% 100%; transition: opacity .25s, transform .35s cubic-bezier(.3, 1.5, .5, 1); pointer-events: none; }
.pet-say::after { content: ""; position: absolute; top: 100%; left: calc(50% - var(--sx, 0px)); width: 10px; height: 10px; background: #fff; transform: translate(-50%, -5px) rotate(45deg); }
.pet-say.on { opacity: 1; transform: translate(calc(-50% + var(--sx, 0px)), 0) scale(1); }
.pbit { position: fixed; z-index: 41; font-size: calc(18px * var(--fz, 1)); pointer-events: none; animation: pbit 1.3s cubic-bezier(.2, .7, .3, 1) forwards; margin: -9px 0 0 -9px; }
@keyframes pbit { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1.1); } }

/* tâche terminée */
.trow.just .cb.on { animation: cbpop .55s cubic-bezier(.3, 1.7, .5, 1); }
.trow.just .cb.on svg { stroke-dasharray: 26; animation: draw .4s .1s ease-out backwards; }
.trow.just .cb.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--btn); animation: ringout .6s ease-out forwards; }
.cb { position: relative; }
@keyframes cbpop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
@keyframes draw { from { stroke-dashoffset: 26; } to { stroke-dashoffset: 0; } }
@keyframes ringout { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(1.9); } }
.trow.just.done .tt { display: inline; text-decoration: none; background: linear-gradient(currentColor, currentColor) no-repeat 100% 58% / 0 2px; animation: strike .45s .2s ease-out forwards; }
@keyframes strike { to { background-size: 100% 2px; } }
.trow.just { animation: rowflash .9s ease-out; }
@keyframes rowflash { 0% { background: rgba(255, 130, 190, .28); } 100% { background: transparent; } }
.trow.done .tm, .trow.done .note { opacity: .6; }

/* --- bonhomme console (visages animés) --- */
.pet { width: 78px; height: 81px; }
.face g[class^="f-"] { display: none; }
.pet-b[data-face="happy"] .f-happy, .pet-b[data-face="joy"] .f-joy, .pet-b[data-face="wow"] .f-wow,
.pet-b[data-face="love"] .f-love, .pet-b[data-face="wink"] .f-wink { display: inline; }
.pet-b:not([data-face]) .f-happy { display: inline; }
.petlayer.sleep .face g[class^="f-"]:not(.f-sleep) { display: none !important; }
.petlayer.sleep .face .f-sleep { display: inline !important; }
.petlayer.sleep .p-eyes { opacity: 1; }
.face { filter: drop-shadow(0 0 3px rgba(190, 150, 255, .35)); animation: glow 2.6s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 6px rgba(190, 150, 255, .7)); } }
.f-love path:first-child, .f-love use { animation: heartbeat .7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes heartbeat { 50% { transform: scale(1.18); } }
.p-ant { transform-box: fill-box; transform-origin: 50% 100%; animation: antwig 2.6s ease-in-out infinite; }
@keyframes antwig { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.p-arm { animation: armsway 3s ease-in-out infinite; }
.p-arm.r { animation-delay: -1.5s; }
@keyframes armsway { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(7deg); } }
.p-wh { transform-box: fill-box; transform-origin: 50% 50%; }
.pet-b.jump .p-wh { animation: roll .45s linear 2; }
@keyframes roll { to { transform: rotate(360deg); } }
.pet-b.dance .p-wh, .pet-b.spin .p-wh { animation: roll .5s linear infinite; }
.pet-b.dance .p-ant { animation: antwig .3s ease-in-out infinite; }
.pet-b { filter: drop-shadow(0 6px 10px rgba(20, 5, 40, .35)); }

.p-ft { transform-box: fill-box; transform-origin: 50% 0; }
.pet-b.jump .p-ft.l, .pet-b.dance .p-ft.l, .pet-b.spin .p-ft.l { animation: step .36s ease-in-out infinite; }
.pet-b.jump .p-ft.r, .pet-b.dance .p-ft.r, .pet-b.spin .p-ft.r { animation: step .36s ease-in-out infinite reverse; }
@keyframes step { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-5px) scaleY(.8); } }

/* applaudissements */
.pet-b.clap { animation: pclap .5s ease-in-out 4; }
@keyframes pclap { 0%, 100% { transform: translateY(0) scale(1.04, .96); } 50% { transform: translateY(-16px) scale(.96, 1.05) rotate(-2deg); } }
.pet-b.clap .p-arm { animation: none; }
.pet-b.clap .p-arm.l { animation: clapl .25s ease-in-out infinite alternate; }
.pet-b.clap .p-arm.r { animation: clapr .25s ease-in-out infinite alternate; }
@keyframes clapl { from { transform: rotate(128deg) scale(1.3); } to { transform: rotate(176deg) scale(1.3); } }
@keyframes clapr { from { transform: rotate(-128deg) scale(1.3); } to { transform: rotate(-176deg) scale(1.3); } }
.pet-b.clap .p-ft.l { animation: step .25s ease-in-out infinite; } .pet-b.clap .p-ft.r { animation: step .25s ease-in-out infinite reverse; }
.pet-b.clap::after { content: ""; position: absolute; left: 50%; top: -8px; width: 62px; height: 62px; margin-left: -31px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .8); opacity: 0; animation: clapring .5s ease-out 4; }
@keyframes clapring { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.5); } }

/* ============ Thème clair : blanc & rose ============ */
:root { --card: #fff; --card2: #ffeef6; --ink: #4b1d3f; --ink2: #9b6b88; --btn: #e24d8a; --btn2: #ff7eb6; --line: rgba(226, 77, 138, .14); color-scheme: light; }
html, body { background: #fff0f6; color: var(--ink); }
#root {
  background:
    radial-gradient(circle at 12% 6%, rgba(255, 126, 182, .28), transparent 42%),
    radial-gradient(circle at 92% 50%, rgba(255, 170, 210, .3), transparent 45%),
    linear-gradient(180deg, #fff 0%, #fff1f7 45%, #ffdcea 100%);
}
.ttl { text-shadow: none; color: var(--ink); }
.ttl .ic { color: var(--btn); filter: none; }
.sec { color: var(--ink2); }
.glass, .card2 { box-shadow: 0 10px 30px rgba(226, 77, 138, .16), inset 0 0 0 1px rgba(255, 126, 182, .2); }
.seg { background: rgba(226, 77, 138, .1); }
.seg button { color: var(--ink2); }
.seg button.on { background: #fff; color: var(--btn); box-shadow: 0 2px 10px rgba(226, 77, 138, .25); }
.back, .gear, .bellbtn { background: rgba(255, 255, 255, .9); color: var(--btn); box-shadow: 0 4px 14px rgba(226, 77, 138, .25); }
.bellbtn .badge { border-color: #fff; }
.hello b { color: var(--ink); text-shadow: none; }
.hello span { color: var(--ink2); }
.btn { box-shadow: 0 6px 18px rgba(226, 77, 138, .4); }
.btn.ghost { background: rgba(226, 77, 138, .1); color: var(--btn); }
.link { color: var(--btn); }
input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="time"], textarea { background: #fff; border-color: rgba(226, 77, 138, .2); }
.ink-input input, .ink-input textarea { background: #fff4f9; }
.ov { background: rgba(75, 29, 63, .35); }
.sheet { background: #fff7fb; }
.sheet .grab { background: #f3bdd6; }
.tabs { background: rgba(255, 255, 255, .97); box-shadow: 0 -8px 30px rgba(226, 77, 138, .18); }
.tab { color: #cf92ae; }
.tab.on { color: var(--btn); box-shadow: 0 0 0 4px rgba(255, 126, 182, .18), 0 4px 14px rgba(226, 77, 138, .3); }
.pop-bell, .pn-ic, .pop-bell { background: linear-gradient(135deg, #ff9cc8, #e24d8a); }
.popcard { background: linear-gradient(180deg, #fff, #ffeef6); }
.trow.just { animation-name: rowflash; }
.fab { background: linear-gradient(135deg, #ff8fc3, #e24d8a); box-shadow: 0 0 0 3px rgba(255, 255, 255, .7), 0 10px 24px rgba(226, 77, 138, .45); }
.uscard { background: linear-gradient(135deg, #ff9cc8, #e24d8a); box-shadow: 0 12px 28px rgba(226, 77, 138, .32), inset 0 0 0 1.5px rgba(255, 255, 255, .5); }
.avt { border-color: #fff; box-shadow: 0 0 0 2px rgba(255, 126, 182, .35), 0 6px 16px rgba(226, 77, 138, .3); }
.btn.pillbtn { background: linear-gradient(135deg, #ffd3e6, #ffb3d3); color: #8a1f55; }
.ncard { background: #fff; }
.in::-webkit-scrollbar { display: none; }

input[type="tel"].code-input { width: 100%; background: #fff4f9; color: var(--ink); border: 1.5px solid rgba(226, 77, 138, .2); border-radius: 16px; padding: 11px 14px; margin: 5px 0; outline: none; font-size: calc(16px * var(--fz, 1)); }
input[type="tel"].code-input:focus { border-color: var(--pink); }
.pairhero .sub { color: var(--ink2); }
.sec { color: var(--ink2); }
.brand p, .authcard p, .divider { color: var(--ink2); }
.pop-bell, .pn-ic, .ncard .ap, .avpick .cam { background: linear-gradient(135deg, #ff9cc8, #e24d8a); }

/* ============ Entrée : blanc & rose ============ */
.gate { background: linear-gradient(180deg, #ffffff 0%, #fff0f7 40%, #ffd3e6 78%, #ffc1da 100%); }
.gate .land { background: none; aspect-ratio: auto; height: 270px; }
.gate .land svg { width: 100%; height: 100%; display: block; }
.gt { color: #9a2a62; text-shadow: 0 2px 18px rgba(255, 255, 255, .9), 0 0 24px rgba(255, 126, 182, .35); }
.gpanel .gt { color: #b02f6f; }
.gline { background: linear-gradient(90deg, transparent, #ff7eb6, transparent); box-shadow: 0 0 12px rgba(255, 126, 182, .5); }
.ph { border-color: #fff; box-shadow: 0 0 0 4px rgba(255, 126, 182, .25), 0 10px 28px rgba(226, 77, 138, .4); }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 4px rgba(255, 126, 182, .22), 0 8px 24px rgba(226, 77, 138, .3); }
  50% { box-shadow: 0 0 0 8px rgba(255, 126, 182, .3), 0 10px 38px rgba(226, 77, 138, .55); }
}
.gate.who-h .ph.h, .gate.who-f .ph.f { box-shadow: 0 0 0 5px rgba(255, 126, 182, .4), 0 12px 36px rgba(226, 77, 138, .55); }
.gate.leaving .ph { box-shadow: 0 0 0 8px rgba(255, 126, 182, .4), 0 0 80px rgba(255, 126, 182, .9); }
.ghint { color: #8a4a6d; }
.glink { color: #a14a77; }
.gprompt { color: var(--ink); }
.cbx { background: rgba(255, 255, 255, .85); border-color: rgba(226, 77, 138, .45); color: #b02f6f; box-shadow: 0 8px 22px rgba(226, 77, 138, .18); }
.cbx.fill { background: #fff; }
.cbx.cur::after { background: #e24d8a; }
.gerr { color: #d12f68; }
.enter { color: #fff; background: linear-gradient(135deg, #ff8fc3, #e24d8a); box-shadow: 0 12px 28px rgba(226, 77, 138, .4), inset 0 0 0 1.5px rgba(255, 255, 255, .5); }

/* papillons */
.bfly { position: absolute; width: 46px; pointer-events: none; z-index: 1; filter: drop-shadow(0 4px 6px rgba(150, 40, 100, .25)); transition: opacity .5s; }
.bfly svg { width: 100%; display: block; overflow: visible; }
.bfly .wl, .bfly .wr { transform-box: view-box; transform-origin: 40px 30px; animation: flap .28s ease-in-out infinite alternate; }
@keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.34); } }
.bfly.b1 { width: 66px; left: 10%; top: 72%; animation: fly1 13s ease-in-out infinite, bfin 1.2s 1s backwards; }
.bfly.b2 { width: 52px; left: 72%; top: 66%; animation: fly2 16s ease-in-out infinite, bfin 1.2s 1.4s backwards; }
.bfly.b3 { width: 42px; left: 44%; top: 78%; animation: fly3 11s ease-in-out infinite, bfin 1.2s 1.8s backwards; }
.bfly.b2 .wl, .bfly.b2 .wr { animation-duration: .33s; } .bfly.b3 .wl, .bfly.b3 .wr { animation-duration: .24s; }
@keyframes bfin { from { opacity: 0; } }
@keyframes fly1 { 0%, 100% { transform: translate(0, 0) rotate(8deg); } 25% { transform: translate(60px, -16px) rotate(-14deg); } 50% { transform: translate(120px, 10px) rotate(12deg); } 75% { transform: translate(50px, 40px) rotate(-8deg); } }
@keyframes fly2 { 0%, 100% { transform: translate(0, 0) rotate(-10deg); } 30% { transform: translate(-70px, -14px) rotate(14deg); } 60% { transform: translate(-130px, 20px) rotate(-12deg); } 80% { transform: translate(-50px, 46px) rotate(8deg); } }
@keyframes fly3 { 0%, 100% { transform: translate(0, 0) rotate(0); } 33% { transform: translate(-60px, -24px) rotate(-16deg); } 66% { transform: translate(70px, -26px) rotate(14deg); } }
.gate .gt, .gate .ghint, .gate .duo, .gate .gpanel, .gate .gsetup, .gate .gline { z-index: 2; }
.gate.phase-code .bfly { opacity: .55; }

/* disparition progressive d'une tâche terminée */
.trow.leaving { overflow: hidden; animation: rowleave .75s cubic-bezier(.4, 0, .2, 1) forwards; }
@keyframes rowleave {
  0% { opacity: 1; transform: none; max-height: 220px; }
  50% { opacity: 0; transform: translateX(46px); max-height: 220px; }
  100% { opacity: 0; transform: translateX(46px); max-height: 0; padding-top: 0; padding-bottom: 0; border-bottom-width: 0; }
}

/* commentaires */
.tbody { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.avt.sm { width: 28px; height: 28px; border-width: 1.5px; box-shadow: 0 0 0 1.5px rgba(255, 126, 182, .3); }
.note.cm { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.note.cm .cmtx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note.cm .cmn { font-size: calc(12px * var(--fz, 1)); font-weight: 700; color: var(--btn); background: #fff; border-radius: 999px; padding: 1px 8px; }
.cm-task { text-align: center; color: var(--ink2); font-size: calc(14px * var(--fz, 1)); margin: -2px 0 10px; }
.clist { max-height: 44vh; overflow-y: auto; padding: 4px 2px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
.cmt { display: flex; gap: 8px; align-items: flex-end; }
.cmt.new { animation: rise .3s cubic-bezier(.2, .8, .2, 1) backwards; }
.cmt .avt { width: 34px; height: 34px; border-width: 2px; }
.cmt-b { max-width: 78%; }
.cmt-t { background: #fff; border-radius: 18px 18px 18px 6px; padding: 9px 13px; box-shadow: 0 3px 12px rgba(226, 77, 138, .12); overflow-wrap: anywhere; }
.cmt.mine { flex-direction: row-reverse; }
.cmt.mine .cmt-t { background: linear-gradient(135deg, #ffb0d2, #ff8fc3); color: #4b1d3f; border-radius: 18px 18px 6px 18px; }
.cmt-m { font-size: calc(11.5px * var(--fz, 1)); color: var(--ink2); margin: 3px 6px 0; } .cmt.mine .cmt-m { text-align: end; }
.cmt-m button { color: #c23a6a; font-size: calc(11.5px * var(--fz, 1)); padding: 0; }
.cm-empty { text-align: center; padding: 22px 10px; display: grid; gap: 4px; color: var(--ink2); justify-items: center; }
.cm-empty b { color: var(--ink); }
.cm-send { display: flex; gap: 8px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.cm-send input { margin: 0; flex: 1; }
.cm-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #ff8fc3, #e24d8a); box-shadow: 0 6px 14px rgba(226, 77, 138, .35); flex-shrink: 0; }
.cm-btn:active { transform: scale(.92); }
.note.cm .avt.sm { flex: 0 0 28px; width: 28px; height: 28px; min-width: 28px; }
.note.cm .cmn { flex: 0 0 auto; }
.note.cm .cmtx { flex: 1 1 auto; }
.note.cm .cmn { direction: ltr; }

.cb.ro, .fav.ro { pointer-events: none; }
.cb.ro { display: grid; place-items: center; }
.ro-hint { display: flex; align-items: center; gap: 6px; margin: -6px 4px 12px; font-size: calc(13px * var(--fz, 1)); color: var(--ink2); }

/* ===== Capsules réalistes ===== */
.cps { display: block; width: 100%; height: auto; overflow: visible; }
.cps .hl, .cps .hr, .cps .sc, .cps .gl, .cps .bd { transform-box: fill-box; transform-origin: center; }
.cps .gl { opacity: 0; }
.cps.ajar .hl { transform: translate(30px, 38px) rotate(70deg); }
.cps.ajar .sc { transform: translate(120px, -74px) scale(1.12) rotate(-14deg); }
.cps.ajar .gl { opacity: .8; }
.cps.wob { animation: wob 2.8s ease-in-out infinite; transform-origin: 50% 60%; }
@keyframes wob { 0%, 100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-5px); } }
.cps.anim { animation: shk 1s ease-in-out both; animation-delay: var(--ad, 0s); transform-origin: 50% 60%; }
.cps.anim .hl { animation: hlo .6s cubic-bezier(.2, .8, .3, 1.3) both; animation-delay: calc(.85s + var(--ad, 0s)); }
.cps.anim .sc { animation: sco 1s cubic-bezier(.2, .9, .3, 1.15) both; animation-delay: calc(1.15s + var(--ad, 0s)); }
.cps.anim .gl { animation: glo .8s ease-out both; animation-delay: calc(1s + var(--ad, 0s)); }
@keyframes shk { 0% { transform: rotate(0); } 15% { transform: rotate(-7deg); } 30% { transform: rotate(7deg); } 45% { transform: rotate(-5deg); } 60% { transform: rotate(5deg); } 80%, 100% { transform: rotate(0); } }
@keyframes hlo { to { transform: translate(30px, 38px) rotate(70deg); } }
@keyframes sco { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(120px, -74px) scale(1.12) rotate(-14deg); } }
@keyframes glo { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
.capstage { position: relative; width: 74%; margin: 34px auto 0; }
.capstage .hrts { position: absolute; inset: 0; pointer-events: none; }
.capstage .hrts i { position: absolute; bottom: 30%; font-style: normal; font-size: calc(20px * var(--fz, 1)); opacity: 0; animation: hup 1.8s ease-out both; }
@keyframes hup { 0% { opacity: 0; transform: translateY(0) scale(.5); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-90px) scale(1.2) rotate(12deg); } }
.capmsg { animation: msgin .7s ease-out both; animation-delay: calc(1.9s + var(--ad, 0s)); }
@keyframes msgin { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }

/* ===== Pet : le message suit le saut + gags ===== */
.pet-b.boing { animation: pboing 1s cubic-bezier(.3, .7, .4, 1); }

.pet[data-act="clap"] .pet-say { animation: bclap .5s ease-in-out 4; }
.pet[data-act="flop"] .pet-say { animation: bflop 1.7s ease-in-out; }
@keyframes bjump { 0%, 100% { translate: 0 0; rotate: 0deg; } 22% { translate: 0 -46px; rotate: -5deg; } 42% { rotate: 4deg; } 62% { translate: 0 -14px; rotate: -2deg; } 82% { translate: 0 0; } }
@keyframes bhop { 0%, 100% { translate: 0 0; rotate: 0deg; } 40% { translate: 0 -30px; rotate: -4deg; } 70% { rotate: 3deg; } }
@keyframes bboing { 0%, 100% { translate: 0 0; rotate: 0deg; } 20% { translate: 0 -78px; rotate: -7deg; } 45% { translate: 0 -70px; rotate: 7deg; } 70% { translate: 0 0; rotate: -3deg; } 85% { rotate: 2deg; } }
@keyframes bspin { 0%, 100% { translate: 0 0; rotate: 0deg; } 30%, 70% { translate: 0 -34px; } 40% { rotate: -6deg; } 60% { rotate: 6deg; } }

/* recadrage + horaires du mode sombre */
.cropbox { position: relative; width: 260px; height: 260px; margin: 14px auto 10px; border-radius: 22px; overflow: hidden; touch-action: none; background: #111; cursor: grab; user-select: none; -webkit-user-select: none; }
.cropbox img { position: absolute; left: 50%; top: 50%; max-width: none; transform-origin: center; pointer-events: none; -webkit-user-drag: none; }
.cropbox::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 400px rgba(0, 0, 0, .55), inset 0 0 0 2px rgba(255, 255, 255, .9); pointer-events: none; }
.cropzoom { width: 100%; margin: 6px 0 4px; accent-color: #e24d8a; }
html[data-theme="dark"] .cropzoom { accent-color: #c9cedb; }
.timerow { display: flex; gap: 10px; margin-top: 10px; }
.timerow label { flex: 1; display: grid; gap: 4px; font-size: calc(13px * var(--fz, 1)); font-weight: 600; color: var(--ink2); }
.timerow input { width: 100%; }

/* ---------- animations : fluidité ---------- */
.ov.out { pointer-events: none; animation: fadeout .22s ease-in forwards !important; }
.ov.out * { animation: none !important; }
.ov.out > .sheet { animation: down .22s cubic-bezier(.4, 0, 1, 1) forwards !important; }
.ov.out > .popcard { animation: popout .2s ease-in forwards !important; }
@keyframes fadeout { to { opacity: 0; } }
@keyframes down { to { transform: translateY(60px); opacity: 0; } }
@keyframes popout { to { transform: translateY(-16px) scale(.9); opacity: 0; } }
.sheet { animation: up .34s cubic-bezier(.2, .9, .3, 1.05); will-change: transform; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.ov { animation: fade .25s ease-out; }

let lastKey = "", lastKey2 = "";
const KEEP_ANIM = /rowflash|strike|cbpop|bump|draw|ringout|badgepop|clapring|shk|pbit/;
/* Un re-render ne doit pas relancer les animations : on reprend l'état précédent (ou on termine l'entrée) */
function smoothAnims(snap, finishNew) {
  const els = root.querySelectorAll("*"), ok = els.length === snap.n;
  root.getAnimations({ subtree: true }).forEach((an) => {
    const t = an.effect && an.effect.target; if (!t || !an.animationName) return;
    let m = null;
    if (ok) { const i = Array.prototype.indexOf.call(els, t); m = snap.a.find((x) => x.i === i && x.n === an.animationName && x.pe === (an.effect.pseudoElement || "")); }
    if (m && m.t != null) { try { an.currentTime = m.t; } catch {} }
    else if (finishNew && !KEEP_ANIM.test(an.animationName)) { const it = an.effect.getComputedTiming().iterations; if (it !== Infinity) { try { an.finish(); } catch {} } }
  });
}
function render(fresh) {
  const keep = fresh ? [] : [...root.querySelectorAll("[data-keep]")].map((el) => ({ k: el.dataset.keep, v: el.value, f: el === document.activeElement, s: el.selectionStart, e: el.selectionEnd }));
  const sc = root.querySelector(".in");
  const st = sc ? sc.scrollTop : 0;
  const shs = root.querySelector(".sheet"), shst = shs ? shs.scrollTop : 0;
  const key = S.stage + "|" + S.screen + "|" + (S.sheet ? S.sheet.type : ""), key2 = S.stage + "|" + S.screen;

  let html = "";
  if (S.stage === "gate") html = gateHTML();
  else if (S.stage === "boot") html = '<div class="screen"></div>';
  else html = appHTML();
  const same = key === lastKey, hadOv = root.querySelector(".ov"), hadOv0 = !!hadOv;
  let snap = null, ghost = null;
  if (same && root.getAnimations) {
    const els = root.querySelectorAll("*"), idx = new Map(); let i = 0; els.forEach((e) => idx.set(e, i++));
    snap = { n: els.length, a: [] };
    root.getAnimations({ subtree: true }).forEach((an) => { const t = an.effect && an.effect.target; if (t && idx.has(t) && an.animationName) snap.a.push({ i: idx.get(t), n: an.animationName, pe: an.effect.pseudoElement || "", t: an.currentTime }); });
  }
  if (hadOv && !hadOv.classList.contains("out")) ghost = hadOv.cloneNode(true);
  root.innerHTML = fin(html);
  if (snap) smoothAnims(snap, hadOv0 || S.stage === "gate");
  const newOv = root.querySelector(".ov");
  if (ghost && !newOv) { ghost.classList.add("out"); root.appendChild(ghost); const rm = () => ghost.remove(); ghost.addEventListener("animationend", rm); setTimeout(rm, 400); }

  keep.forEach((x) => {
    const el = root.querySelector(`[data-keep="${x.k}"]`);
    if (!el) return;
    if (el.type !== "file") el.value = x.v;
    if (x.f) { el.focus(); try { el.setSelectionRange(x.s, x.e); } catch {} }
  });
  const nsc = root.querySelector(".in");
  if (nsc && key2 === lastKey2) nsc.scrollTop = st;
  const nsh = root.querySelector(".sheet"); if (nsh && key === lastKey) nsh.scrollTop = shst;
  lastKey = key; lastKey2 = key2;
  if (S.stage === "gate") paintGate();
  Pet.sync();
}

    : `<div class="card2"><div class="ans-h">${ic("heart", 18, true)}<span>إجابة ${esc(myName())}</span><button data-act="q-edit" style="margin-inline-start:auto;color:#a23fb5;font-size:calc(13px * var(--fz,1));font-weight:600">تعديل</button></div><div class="ans-t">${ue(mine.answer)}</div></div>`;
  const theirCard = theirs
    ? `<div class="card2"><div class="ans-h">${ic("heart", 18, true)}<span>إجابة ${esc(partnerName())}</span></div><div class="ans-t">${ue(theirs.answer)}</div></div>`
    : `<div class="card2"><div class="ans-h">${ic("lock", 18)}<span>إجابة ${esc(partnerName())}</span></div><div class="muted small">${mine ? "بانتظار جوابه… ⏳" : "جاوب أول، وبعدها بتشوف جواب " + esc(partnerName()) + " 🙈"}</div></div>`;
  const days = [...new Set(S.answers.map((a) => a.day))].filter((d) => d !== S.today).sort().reverse().slice(0, 7);
  const hist = days.map((d) => `<div class="card2"><div class="ans-h"><span>${esc(questionFor(d))}</span></div><div class="muted small" style="margin-bottom:6px">${esc(fmtShort(new Date(d + "T12:00:00")))}</div>${S.answers.filter((a) => a.day === d).map((a) => `<div class="small" style="font-weight:700;color:var(--btn)">${a.user_id === S.user.id ? esc(myName()) : esc(partnerName())}</div><div class="ans-t" style="margin-bottom:8px">${ue(a.answer)}</div>`).join("")}</div>`).join("");
  return `<div class="art">${ART.stars ? ART.stars() : ""}</div>
  <div class="in"><div class="ttl">${ic("help", 26)}<span>سؤال اليوم</span></div>
    <div class="card2 qcard"><div class="qhead">${ic("calendar", 20)}<span>سؤال اليوم</span></div><div class="qtext">${esc(q)}</div></div>
    ${mineCard}${theirCard}
    ${days.length ? `<div class="sec">أسئلة سابقة</div>${hist}` : ""}
  </div>`;
}

/* ---------- Capsules ---------- */
function capCard(c, today) {
  const who = c.created_by === S.user.id ? myName() : partnerName();
  const d = new Date(c.open_at);
  const when = today ? (c.is_open ? "انفتحت اليوم " + fmtTime(d) : "تنفتح اليوم " + fmtTime(d)) : (c.is_open ? "فُتحت في " : "تفتح في ") + fmtDate(c.open_at);
  return `<button class="ccard ${c.is_open ? "open" : ""} ${today ? "tc" : ""}" data-act="cap-open" data-id="${c.id}">
    <span class="cimg">${ART.capsuleSvg ? ART.capsuleSvg(c.is_open ? "ajar" : "") : ""}</span>
    <span class="tx"><b>${ue(c.title)}</b><span class="s">${esc(when)}</span><span class="s">من ${esc(who)}</span></span>
    <span class="lk ${c.is_open ? "ok" : ""}">${ic(c.is_open ? "unlock" : "lock", 20)}</span></button>`;
}
function capsulesHTML() {
  const up = S.capsules.filter((c) => !c.is_open), hist = S.capsules.filter((c) => c.is_open).reverse();
  const rows = (up.length ? `<div class="sec">قادمة ⏳</div>` + up.map((c) => capCard(c, false)).join("") : "") + (hist.length ? `<div class="sec hist">السجل · كبسولات انفتحت 💌</div>` + hist.map((c) => capCard(c, false)).join("") : "");
  const rep = (S.creplies || []).filter((r) => r.author_id !== S.user.id).slice().reverse();
  const repHTML = rep.length ? `<div class="sec">ردود على كبسولاتك 💬</div>` + rep.map((r) => `<div class="card2"><div class="ans-h">${ic("heart", 18, true)}<span>${esc(nm(whoOf(r.author_id)))} ردّ على «${ue(r.title)}»</span></div><div class="ans-t">${ue(r.body)}</div><div class="muted small" style="margin-top:4px">${esc(ago(r.created_at))}</div></div>`).join("") : "";
  return `<div class="art capart">${ART.jar ? ART.jar() : ""}</div>
  <div class="in"><div class="ttl">${ic("heart", 26)}<span>كبسولة الزمن</span></div>
    <button class="btn pillbtn" data-act="cap-new" style="margin-bottom:14px">كبسولة جديدة ${ic("plus", 20)}</button>
    ${repHTML}${(rows || repHTML) ? rows : `<div class="glass"><div class="empty">${ic("mail", 34)}<div>ما وصلتك كبسولات بعد. اكتب وحدة لـ${esc(partnerName())} وبتوصلها لما ينفتح موعدها.</div></div></div>`}
  </div>`;
}

/* ---------- Notifications ---------- */
function notifHTML() {
  const now = new Date(), notifs = allNotifs();

  const cards = notifs.map((n) => `<div class="ncard"><div class="ap">${ic("heart", 15, true)}</div><div class="nb"><div class="top"><span>Hasnaa &amp; Fouad</span><span>${n.diff < 0 ? "فات" : "الآن"}</span></div><b>${esc(n.head)}</b><div class="tt2">${ue(n.sub)}</div><div class="rel">${esc(n.rel)}</div></div></div>`).join("");
  const perm = "Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied"
    ? `<button class="btn light" data-act="enable-notif" style="margin-bottom:12px">${ic("bell", 18)} فعّل التنبيهات</button>` : "";
  return `<div class="art bottom">${ART.lavender ? ART.lavender() : ""}</div>
  <div class="in tight" style="padding-top:calc(56px + var(--safe-top))">
    <div class="lock"><div class="clock">${h}:${pad(now.getMinutes())}</div><div class="date">${esc(new Intl.DateTimeFormat(LOC, { weekday: "long", day: "numeric", month: "long" }).format(now))}</div></div>
    ${perm}${cards || `<div class="ncard"><div class="nb"><b>ما في تذكيرات قريبة</b><div class="tt2">بتظهر هون المهام اللي موعدها خلال ٢٤ ساعة.</div></div></div>`}
  </div>`;
}

      ${pushOn() ? `<div class="notrow"><button class="btn light sm" data-act="test-push">جرّب إشعار</button><button class="btn light sm" data-act="disable-push">إيقاف</button></div>` : `<div class="muted small" style="margin:4px 2px 8px">${isIOS() && !isStandalone() ? "بالآيفون: افتح التطبيق من Safari ← مشاركة ← «إضافة إلى الشاشة الرئيسية»، وبعدين فعّلها من داخل التطبيق." : "بتوصلك إشعارات حتى لو التطبيق مسكّر."}</div>`}
      <div class="notrow"><button class="btn light sm" data-act="test-partner">${ic("bell", 16)} ابعت إشعار تجريبي لشريكي</button></div>
      ${tg("pref-n", "profile", "تغيير الصورة أو الاسم", P.n.profile)}${tg("pref-n", "capsules", "كبسولة جديدة إلك", P.n.capsules)}${tg("pref-n", "todo", "شي جديد بقائمة شريكي", P.n.todo)}${tg("pref-n", "shared", "مهام مشتركة جديدة", P.n.shared)}${tg("pref-n", "comments", "تعليقات جديدة", P.n.comments)}${tg("pref-n", "answers", "جواب سؤال اليوم", P.n.answers)}${tg("pref-n", "tasks", "تذكير بمواعيد المهام", P.n.tasks)}

      <div class="notrow"><button class="btn light sm" data-act="test-sound">▶ جرّب النغمة</button></div>

/* =====================================================
   5. Entrée, verrouillage, configuration des comptes
   ===================================================== */
function toLogin() {
  S.stage = "gate"; S.gate = { phase: "pick", who: null, mode: "login", step: null, first: "" };
  S.code = ""; S.err = ""; S.busy = false; render(true);
}
function pickWho(w) {
  const st = S.gate;
  if (st.phase === "code" && st.who === w) return;
  st.who = w; st.phase = "code"; st.step = st.mode === "setup" ? "code1" : null; st.first = "";

const uuid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === "x" ? r : (r & 3) | 8).toString(16); }));

async function saveCapsule() {
  if (S.uploading) return;
  const title = (document.getElementById("c-title").value || "").trim();
  const body = (document.getElementById("c-body").value || "").trim();
  const date = document.getElementById("c-date").value, time = document.getElementById("c-time").value || "09:00";
  if (!title) return toast("اكتب عنوان الكبسولة");
  if (!body && !S.picked.length) return toast("اكتب رسالة أو أضف ملف");
  if (!date) return toast("اختار تاريخ الفتح");
  const openAt = new Date(date + "T" + time);
  if (!(openAt > new Date())) return toast("تاريخ الفتح لازم يكون بالمستقبل");
  S.uploading = true; render();
  try {
    const id = uuid(), cid = S.profile.couple_id, attachments = [];
    for (let i = 0; i < S.picked.length; i++) {
      const f = S.picked[i];
      const safe = f.name.replace(/[^\w.\-]+/g, "_").slice(-60) || "file";
      const path = `${cid}/${id}/${i}-${safe}`;
      const { error } = await sb.storage.from("capsules").upload(path, f, { contentType: f.type || "application/octet-stream" });
      if (error) throw error;
      attachments.push({ path, name: f.name, type: f.type || "" });
    }
    const { error } = await sb.from("capsules").insert({ id, couple_id: cid, created_by: S.user.id, title, body, open_at: openAt.toISOString(), attachments });
    if (error) throw error;
    S.picked = []; S.sheet = null; S.uploading = false;
    await loadCapsules(); toast("انقفلت الكبسولة 🔒"); render(true);
  } catch (err) { S.uploading = false; toast(mapError(err)); render(); }
}

async function openCapsule(id) {

function resizeToAvatar(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const n = 320, c = document.createElement("canvas"); c.width = c.height = n;
      const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.getContext("2d").drawImage(img, sx, sy, m, m, 0, 0, n, n);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("img")); };
    img.src = url;
  });
}

/* ---------- Recadrage de la photo avant l'enregistrement ---------- */
const CROP = { img: null, url: null, z: 1, x: 0, y: 0, V: 260 };
function openCrop(file) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { Object.assign(CROP, { img, url, z: 1, x: 0, y: 0 }); S.sheet = { type: "crop" }; render(true); initCrop(); };
  img.onerror = () => { URL.revokeObjectURL(url); toast("ما قدرت أقرأ الصورة"); };
  img.src = url;
}
function cropGeom() {
  const im = CROP.img, V = CROP.V, s = (V / Math.min(im.naturalWidth, im.naturalHeight)) * CROP.z;
  const mx = Math.max(0, (im.naturalWidth * s - V) / 2), my = Math.max(0, (im.naturalHeight * s - V) / 2);
  CROP.x = Math.max(-mx, Math.min(mx, CROP.x)); CROP.y = Math.max(-my, Math.min(my, CROP.y));
  return s;
}
function paintCrop() {
  const el = document.getElementById("cropimg"); if (!el || !CROP.img) return;
  const s = cropGeom(), im = CROP.img;
  el.style.width = im.naturalWidth + "px"; el.style.height = im.naturalHeight + "px";
  el.style.transform = "translate(-50%,-50%) translate(" + CROP.x + "px," + CROP.y + "px) scale(" + s + ")";
}
function initCrop() {
  const box = document.getElementById("cropbox"); if (!box) return;
  const ptrs = new Map(); let last = 0;
  const dist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  box.addEventListener("pointerdown", (e) => { box.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) last = dist(); });
  box.addEventListener("pointermove", (e) => {
    const q = ptrs.get(e.pointerId); if (!q) return;
    if (ptrs.size === 1) { CROP.x += e.clientX - q.x; CROP.y += e.clientY - q.y; }
    q.x = e.clientX; q.y = e.clientY;
    if (ptrs.size === 2) { const d = dist(); if (last) CROP.z = Math.max(1, Math.min(4, CROP.z * d / last)); last = d; const z = document.getElementById("cropzoom"); if (z) z.value = CROP.z; }
    paintCrop();
  });
  const up = (e) => { ptrs.delete(e.pointerId); last = 0; };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
  box.addEventListener("wheel", (e) => { e.preventDefault(); CROP.z = Math.max(1, Math.min(4, CROP.z * (e.deltaY < 0 ? 1.06 : 0.94))); const z = document.getElementById("cropzoom"); if (z) z.value = CROP.z; paintCrop(); }, { passive: false });
  paintCrop();
}
function closeCrop(save) {
  let data = null;
  if (save && CROP.img) {
    const s = cropGeom(), im = CROP.img, half = CROP.V / (2 * s);
    const cx = im.naturalWidth / 2 - CROP.x / s, cy = im.naturalHeight / 2 - CROP.y / s;
    const c = document.createElement("canvas"); c.width = c.height = 320;
    c.getContext("2d").drawImage(im, cx - half, cy - half, half * 2, half * 2, 0, 0, 320, 320);
    data = c.toDataURL("image/jpeg", 0.85);
  }
  try { URL.revokeObjectURL(CROP.url); } catch {}
  CROP.img = null; S.sheet = { type: "settings" }; render(true);
  if (data) saveAvatarData(data);
}
function bind() {
  root.addEventListener("click", onClick);
  let lpT = null, lpX = 0, lpY = 0;
  root.addEventListener("pointerdown", (e) => {
    const tb = e.target.closest(".tbody"); if (!tb) return;
    lpX = e.clientX; lpY = e.clientY; clearTimeout(lpT);
    lpT = setTimeout(() => { lpT = null; S.noTap = true; setTimeout(() => { S.noTap = false; }, 700); clearTimeout(tapT); tapT = null; if (navigator.vibrate) try { navigator.vibrate(12); } catch {} openComments(tb.dataset.id); }, 520);
  });
  const lpCancel = () => { clearTimeout(lpT); lpT = null; };
  root.addEventListener("pointerup", lpCancel); root.addEventListener("pointercancel", lpCancel);
  root.addEventListener("pointermove", (e) => { if (lpT && Math.hypot(e.clientX - lpX, e.clientY - lpY) > 10) lpCancel(); });
  root.addEventListener("contextmenu", (e) => { if (e.target.closest(".tbody")) e.preventDefault(); });
  root.addEventListener("change", (e) => {
    if (e.target && e.target.id === "s-avatar") { const f = e.target.files[0]; if (f) openCrop(f); e.target.value = ""; return; }
    if (e.target && (e.target.id === "s-dfrom" || e.target.id === "s-dto") && e.target.value) { setPref(e.target.id === "s-dfrom" ? "dFrom" : "dTo", e.target.value); return; }
    if (e.target && e.target.id === "c-files") {
      const files = [...e.target.files];

      S.picked = S.picked.concat(ok).slice(0, 5);
      render();
    }
  });
  root.addEventListener("input", (e) => {
    const t = e.target; if (!t) return;
    if (t.id === "codein") {
      const v = t.value.replace(/\D/g, "").slice(0, N);
      t.value = v; S.code = v; S.err = ""; paintCode();
      if (v.length === N && S.stage === "gate") setTimeout(() => (S.gate.mode === "setup" ? setupNext() : submitLogin()), 70);
    } else if (t.id === "cropzoom") { CROP.z = +t.value; paintCrop(); } else if (t.id === "s-c1" || t.id === "s-c2") t.value = t.value.replace(/\D/g, "").slice(0, N);
  });
  root.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target && e.target.id === "cm-in") { e.preventDefault(); sendComment(S.sheet.id); return; } if (e.key === "Enter" && e.target && e.target.id === "cr-in") { e.preventDefault(); sendCapReply(S.sheet.id); return; } if (e.key === "Enter" && e.target && e.target.id === "codein" && S.stage === "gate" && S.gate.mode === "login") { e.preventDefault(); submitLogin(); } });
  setInterval(() => { if (P.theme === "auto") applyPrefs(); }, 60000);
  document.addEventListener("visibilitychange", () => {
    document.documentElement.classList.toggle("bgpause", document.hidden);
    if (!document.hidden && P.theme === "auto") applyPrefs();
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (S.stage !== "app") return;
    if (LOCK_MS > 0 && hiddenAt && Date.now() - hiddenAt > LOCK_MS) { lockApp(); return; }
    if (S.user && S.profile) { tick(); poll(); syncAvatars().then(() => render()); }
  });
  if (window.visualViewport) {
    let fullH = 0;
    const fit = () => {
      const vh = window.visualViewport.height; if (vh > fullH) fullH = vh;
      const ae = document.activeElement, typing = !!(ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName));
      const d = document.documentElement.style;
      d.setProperty("--app-h", typing && fullH - vh > 100 ? vh + "px" : "max(100%, 100lvh)");
      d.setProperty("--gh", fullH + "px"); window.scrollTo(0, 0);
    };
    window.visualViewport.addEventListener("resize", fit); document.addEventListener("focusout", () => { setTimeout(fit, 60); setTimeout(fit, 350); }); fit();
  }
}
